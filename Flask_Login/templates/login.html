
<!DOCTYPE html>
<html>
<head>
    <title>Flask Login</title>
</head>
<body>

    <h2>Login Form</h2>

    <form method="POST">
        <label>Username:</label>
        <input type="text" name="username" required>
        <br><br>

        <label>Password:</label>
        <input type="password" name="password" required>
        <br><br>

        <button type="submit">Login</button>
    </form>

    <h3>{{ message }}</h3>

</body>
</html>
